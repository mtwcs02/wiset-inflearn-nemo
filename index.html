<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemo Analytics | 니모 스토어 분석 대시보드</title>
    <meta name="description" content="니모 스토어의 강남 지역 상권 데이터 분석 대시보드입니다. 업종 분포, 층별 분포, 주요 키워드 분석을 제공합니다.">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Nemo Analytics | 니모 스토어 분석 대시보드">
    <meta property="og:description" content="강남 지역 상권 데이터 시각화 및 인사이트 대시보드">
    <meta property="og:type" content="website">

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-dark: #08090C;
            --bg-card: #12141C;
            --accent-primary: #10B981;
            --accent-secondary: #3B82F6;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --text-dim: #6B7280;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
            --gradient: linear-gradient(135deg, #10B981 0%, #3B82F6 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Noto Sans KR', 'DM Sans', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
        }

        h1, h2, h3 {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            font-weight: 600;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }

        /* Layout */
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 2.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 4rem;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1.5rem;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, var(--border), transparent);
        }

        .header-title h1 {
            font-size: 3rem;
            letter-spacing: -1.5px;
            background: linear-gradient(90deg, #FFF, #10B981, #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .header-action {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Badge/Tag */
        .badge {
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge.live {
            color: var(--accent-primary);
            border-color: var(--accent-glow);
        }

        .badge.live .dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .stat-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-primary);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gradient);
            opacity: 0;
            transition: 0.3s;
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card i.bg-icon {
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 6rem;
            opacity: 0.03;
            color: var(--text-primary);
            transform: rotate(-15deg);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2.75rem;
            font-weight: 800;
            color: #FFF;
            margin-bottom: 0.5rem;
        }

        .stat-trend {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .trend-up { color: var(--accent-primary); }
        .trend-neutral { color: var(--text-dim); }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            padding: 2rem;
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h2 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #FFF;
        }

        /* Specific Cards */
        .industry-card { grid-column: span 5; }
        .floor-card { grid-column: span 7; }
        .keyword-card { grid-column: span 4; }
        .table-card { grid-column: span 8; }

        @media (max-width: 1200px) {
            .industry-card, .floor-card, .keyword-card, .table-card {
                grid-column: span 12;
            }
        }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        /* Keywords */
        .keyword-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .keyword-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            background: var(--glass);
            border: 1px solid transparent;
            border-radius: 1rem;
            transition: all 0.2s;
            cursor: default;
        }

        .keyword-item:hover {
            background: rgba(16, 185, 129, 0.08);
            border-color: var(--accent-glow);
            transform: scale(1.02);
        }

        .keyword-name { font-weight: 500; }
        .keyword-score {
            font-family: 'Outfit', sans-serif;
            color: var(--accent-primary);
            font-weight: 700;
            background: var(--accent-glow);
            padding: 0.2rem 0.6rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 0.5rem;
            font-size: 0.95rem;
        }

        .data-table th {
            text-align: left;
            padding: 1rem 1.5rem;
            color: var(--text-dim);
            font-weight: 500;
            border-bottom: 1px solid var(--border);
        }

        .data-table td {
            padding: 1.25rem 1.5rem;
            background: var(--glass);
        }

        .data-table tr td:first-child { border-radius: 1rem 0 0 1rem; }
        .data-table tr td:last-child { border-radius: 0 1rem 1rem 0; }

        .data-table tr:hover td {
            background: rgba(255, 255, 255, 0.05);
        }

        .price { font-family: 'Outfit', sans-serif; font-weight: 600; }
        .unit { font-size: 0.8rem; color: var(--text-dim); font-weight: 400; margin-left: 2px; }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate {
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>Nemo Analytics</h1>
                <p>니모 스토어 강남 상권 데이터 대시보드 v1.0</p>
            </div>
            <div class="header-action">
                <div class="badge live">
                    <div class="dot"></div>
                    실시간 데이터 연결됨
                </div>
                <div class="badge">
                    <i data-lucide="clock" style="width:14px"></i>
                    마지막 업데이트: 2026.04.28
                </div>
            </div>
        </header>

        <!-- Stats Section -->
        <div class="stats-grid">
            <div class="stat-card animate delay-1">
                <i data-lucide="store" class="bg-icon"></i>
                <div class="stat-label">총 등록 매물 수</div>
                <div class="stat-value">673</div>
                <div class="stat-trend trend-up">
                    <i data-lucide="arrow-up-right" style="width:16px"></i>
                    <span>시장 지배력 높음</span>
                </div>
            </div>
            <div class="stat-card animate delay-2">
                <i data-lucide="coins" class="bg-icon"></i>
                <div class="stat-label">평균 보증금</div>
                <div class="stat-value">6,895<span class="unit">만원</span></div>
                <div class="stat-trend trend-neutral">
                    <span>중앙값: 4,000 만원</span>
                </div>
            </div>
            <div class="stat-card animate delay-3">
                <i data-lucide="calendar" class="bg-icon"></i>
                <div class="stat-label">평균 월세</div>
                <div class="stat-value">534<span class="unit">만원</span></div>
                <div class="stat-trend trend-neutral">
                    <span>중앙값: 340 만원</span>
                </div>
            </div>
            <div class="stat-card animate delay-4">
                <i data-lucide="maximize" class="bg-icon"></i>
                <div class="stat-label">평균 면적</div>
                <div class="stat-value">127.6<span class="unit">㎡</span></div>
                <div class="stat-trend trend-neutral">
                    <span>약 38.6 평 규모</span>
                </div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="main-grid">
            <div class="card industry-card animate delay-2">
                <div class="card-header">
                    <h2><i data-lucide="pie-chart"></i> 업종별 분포</h2>
                    <div class="badge">Top Categories</div>
                </div>
                <div class="chart-container">
                    <canvas id="industryChart"></canvas>
                </div>
            </div>

            <div class="card floor-card animate delay-3">
                <div class="card-header">
                    <h2><i data-lucide="layers"></i> 층별 매물 분포</h2>
                    <div class="badge">Floor Analysis</div>
                </div>
                <div class="chart-container">
                    <canvas id="floorChart"></canvas>
                </div>
            </div>

            <div class="card keyword-card animate delay-4">
                <div class="card-header">
                    <h2><i data-lucide="hash"></i> 주요 분석 키워드 (TF-IDF)</h2>
                </div>
                <div class="keyword-list" id="keywordList">
                    <!-- JS populated -->
                </div>
            </div>

            <div class="card table-card animate delay-4">
                <div class="card-header">
                    <h2><i data-lucide="trending-up"></i> 조회수 상위 매물</h2>
                    <div class="badge live">Hot Listings</div>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>매물 명칭</th>
                                <th>보증금</th>
                                <th>월세</th>
                                <th>권리금</th>
                                <th>면적</th>
                                <th>조회수</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody">
                            <!-- JS populated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Init Lucide
        lucide.createIcons();

        // Colors
        const colors = {
            emerald: '#10B981',
            blue: '#3B82F6',
            violet: '#8B5CF6',
            amber: '#F59E0B',
            rose: '#F43F5E',
            slate: '#475569',
            dark: '#1E293B'
        };

        // Data
        const industryData = {
            labels: ['기타업종', '일반음식점', '서비스업', '휴게음식점', '오락스포츠', '주류점', '판매업'],
            counts: [325, 96, 86, 85, 36, 31, 14]
        };

        const floorData = {
            labels: ['B2 이하', 'B1층', '1층', '2층', '3층', '4층', '5층', '6층 이상'],
            counts: [9, 123, 209, 108, 57, 59, 44, 64]
        };

        const keywords = [
            {word: "아정당부동산", weight: 123},
            {word: "역삼동", weight: 70.4},
            {word: "강남역", weight: 47.2},
            {word: "인테리어", weight: 33.9},
            {word: "서초동", weight: 31.5},
            {word: "역세권", weight: 29.7},
            {word: "무권리", weight: 25.6}
        ];

        const topStores = [
            {title: "신논현역 고깃집", dep: "40,000", rent: "6,700", prem: "180,000", size: "66.12", views: "988"},
            {title: "역삼동 카페", dep: "10,000", rent: "1,000", prem: "30,000", size: "19.83", views: "956"},
            {title: "역삼동 고깃집", dep: "180,000", rent: "14,000", prem: "300,000", size: "115.7", views: "956"},
            {title: "강남역 방탈출", dep: "40,000", rent: "3,800", prem: "130,000", size: "115.17", views: "943"},
            {title: "서초동 파티룸", dep: "10,000", rent: "1,350", prem: "5,000", size: "38.81", views: "940"}
        ];

        // Industry Chart
        new Chart(document.getElementById('industryChart'), {
            type: 'doughnut',
            data: {
                labels: industryData.labels,
                datasets: [{
                    data: industryData.counts,
                    backgroundColor: [colors.emerald, colors.blue, colors.violet, colors.amber, colors.rose, colors.slate, colors.dark],
                    borderWidth: 0,
                    hoverOffset: 15
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: {
                            color: '#9CA3AF',
                            font: { family: 'Noto Sans KR', size: 12 },
                            usePointStyle: true,
                            padding: 20
                        }
                    }
                },
                cutout: '75%'
            }
        });

        // Floor Chart
        new Chart(document.getElementById('floorChart'), {
            type: 'bar',
            data: {
                labels: floorData.labels,
                datasets: [{
                    label: '매물 수',
                    data: floorData.counts,
                    backgroundColor: 'rgba(59, 130, 246, 0.4)',
                    borderColor: colors.blue,
                    borderWidth: 2,
                    borderRadius: 8,
                    hoverBackgroundColor: colors.blue
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#6B7280' }
                    },
                    x: { grid: { display: false }, ticks: { color: '#9CA3AF' } }
                }
            }
        });

        // Keywords
        const keywordContainer = document.getElementById('keywordList');
        keywords.forEach(k => {
            const div = document.createElement('div');
            div.className = 'keyword-item';
            div.innerHTML = `
                <span class="keyword-name">${k.word}</span>
                <span class="keyword-score">${k.weight}</span>
            `;
            keywordContainer.appendChild(div);
        });

        // Table
        const tableBody = document.getElementById('dataTableBody');
        topStores.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight:500">${s.title}</td>
                <td class="price">${s.dep}<span class="unit">만</span></td>
                <td class="price">${s.rent}<span class="unit">만</span></td>
                <td class="price">${s.prem}<span class="unit">만</span></td>
                <td>${s.size}㎡</td>
                <td><span class="badge live">${s.views}</span></td>
            `;
            tableBody.appendChild(tr);
        });
    </script>
</body>
</html>
