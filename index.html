<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>니모 부동산 데이터 분석 대시보드</title>
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0F1115;
            --card-bg: #1A1D24;
            --accent-color: #10B981;
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --border-color: #2D333F;
            --glass-bg: rgba(26, 29, 36, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }

        /* Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title h1 {
            font-size: 2.5rem;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #FFF, #10B981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1.25rem;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .stat-card i {
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 5rem;
            opacity: 0.05;
            color: var(--accent-color);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2.25rem;
            font-weight: 800;
            color: #FFF;
        }

        .stat-trend {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        .stat-trend.up { color: var(--accent-color); }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 1.25rem;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h2 {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Specific Cards */
        .industry-card { grid-column: span 5; }
        .floor-card { grid-column: span 7; }
        .keyword-card { grid-column: span 4; }
        .table-card { grid-column: span 8; }

        @media (max-width: 1100px) {
            .industry-card, .floor-card, .keyword-card, .table-card {
                grid-column: span 12;
            }
        }

        /* Charts Wrapper */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        /* Keyword List */
        .keyword-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .keyword-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: rgba(255,255,255,0.03);
            border-radius: 0.75rem;
            transition: 0.2s;
        }

        .keyword-item:hover {
            background: rgba(16, 185, 129, 0.1);
        }

        .keyword-name { font-weight: 500; }
        .keyword-score {
            font-family: 'Outfit', sans-serif;
            color: var(--accent-color);
            font-weight: 600;
        }

        /* Table Styles */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .data-table th {
            text-align: left;
            padding: 1rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            font-weight: 500;
        }

        .data-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table tr:last-child td { border-bottom: none; }

        .tag {
            padding: 0.25rem 0.6rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-color);
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>니모 부동산 분석</h1>
                <p>니모 스토어 상권 데이터 분석 대시보드 • 강남 지역</p>
            </div>
            <div class="header-action">
                <span class="tag">마지막 업데이트: 2026.04.28</span>
            </div>
        </header>

        <!-- Stats Section -->
        <div class="stats-grid">
            <div class="stat-card animate delay-1">
                <i data-lucide="store"></i>
                <div class="stat-label">총 매물 수</div>
                <div class="stat-value">673</div>
                <div class="stat-trend up">
                    <i data-lucide="trending-up" style="width:14px"></i>
                    <span>시장 지배력 높음</span>
                </div>
            </div>
            <div class="stat-card animate delay-2">
                <i data-lucide="coins"></i>
                <div class="stat-label">평균 보증금</div>
                <div class="stat-value">6,895<span style="font-size:1rem; font-weight:400; color:var(--text-secondary)"> 만원</span></div>
                <div class="stat-trend">
                    <span>중앙값: 4,000 만원</span>
                </div>
            </div>
            <div class="stat-card animate delay-3">
                <i data-lucide="calendar"></i>
                <div class="stat-label">평균 월세</div>
                <div class="stat-value">534<span style="font-size:1rem; font-weight:400; color:var(--text-secondary)"> 만원</span></div>
                <div class="stat-trend">
                    <span>중앙값: 340 만원</span>
                </div>
            </div>
            <div class="stat-card animate delay-4">
                <i data-lucide="maximize"></i>
                <div class="stat-label">평균 면적</div>
                <div class="stat-value">127.6<span style="font-size:1rem; font-weight:400; color:var(--text-secondary)"> ㎡</span></div>
                <div class="stat-trend">
                    <span>약 38.6 평</span>
                </div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="main-grid">
            <!-- Industry Distribution -->
            <div class="card industry-card animate delay-2">
                <div class="card-header">
                    <h2><i data-lucide="pie-chart"></i> 업종별 분포</h2>
                </div>
                <div class="chart-container">
                    <canvas id="industryChart"></canvas>
                </div>
            </div>

            <!-- Floor Distribution -->
            <div class="card floor-card animate delay-3">
                <div class="card-header">
                    <h2><i data-lucide="layers"></i> 층별 매물 분포</h2>
                </div>
                <div class="chart-container">
                    <canvas id="floorChart"></canvas>
                </div>
            </div>

            <!-- Keywords -->
            <div class="card keyword-card animate delay-4">
                <div class="card-header">
                    <h2><i data-lucide="hash"></i> 주요 키워드 분석 (TF-IDF)</h2>
                </div>
                <div class="keyword-list" id="keywordList">
                    <!-- JS populated -->
                </div>
            </div>

            <!-- Data Table -->
            <div class="card table-card animate delay-4">
                <div class="card-header">
                    <h2><i data-lucide="list"></i> 조회수 상위 매물</h2>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>매물 명칭</th>
                            <th>보증금</th>
                            <th>월세</th>
                            <th>권리금</th>
                            <th>면적</th>
                            <th>조회수</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <!-- JS populated -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Init Lucide Icons
        lucide.createIcons();

        // Data from Report
        const industryData = {
            labels: ['기타업종', '일반음식점', '서비스업', '휴게음식점', '오락스포츠', '주류점', '판매업'],
            counts: [325, 96, 86, 85, 36, 31, 14]
        };

        const floorData = {
            labels: ['지하 2층 이하', '지하 1층', '1층', '2층', '3층', '4층', '5층', '6층 이상'],
            counts: [9, 123, 209, 108, 57, 59, 44, 64] // 6층 이상 aggregated for visual
        };

        const keywords = [
            {word: "아정당부동산중개법인", weight: 123},
            {word: "역삼동", weight: 70.4},
            {word: "강남역", weight: 47.2},
            {word: "인테리어", weight: 33.9},
            {word: "서초동", weight: 31.5},
            {word: "역세권", weight: 29.7},
            {word: "무권리", weight: 25.6},
            {word: "신논현역", weight: 23.3}
        ];

        const topStores = [
            {title: "신논현역 초역세권 고깃집", dep: "40,000", rent: "6,700", prem: "180,000", size: "66.12", views: "988"},
            {title: "역삼동 위치조건 뛰어난 카페", dep: "10,000", rent: "1,000", prem: "30,000", size: "19.83", views: "956"},
            {title: "인테리어 완비된 역삼동 고깃집", dep: "180,000", rent: "14,000", prem: "300,000", size: "115.7", views: "956"},
            {title: "강남역 점프 밀라노 방탈출 매장", dep: "40,000", rent: "3,800", prem: "130,000", size: "115.17", views: "943"},
            {title: "접근성 좋은 서초동 파티룸", dep: "10,000", rent: "1,350", prem: "5,000", size: "38.81", views: "940"},
            {title: "테라스 돋보이는 깔끔한 상가", dep: "60,000", rent: "5,000", prem: "20,000", size: "109.09", views: "925"},
            {title: "역삼역 인근 대형 사무실", dep: "200,000", rent: "18,000", prem: "0", size: "250.5", views: "880"},
            {title: "서초동 조용한 스터디 카페", dep: "5,000", rent: "250", prem: "10,000", size: "45.2", views: "850"}
        ];

        // Industry Doughnut Chart
        new Chart(document.getElementById('industryChart'), {
            type: 'doughnut',
            data: {
                labels: industryData.labels,
                datasets: [{
                    data: industryData.counts,
                    backgroundColor: [
                        '#10B981', '#059669', '#047857', '#065F46', '#064E3B', '#022C22', '#111827'
                    ],
                    borderWidth: 0,
                    hoverOffset: 10
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: {
                            color: '#9CA3AF',
                            font: { family: 'DM Sans', size: 12 },
                            usePointStyle: true,
                            padding: 20
                        }
                    },
                    tooltip: {
                        backgroundColor: '#1A1D24',
                        titleFont: { family: 'Outfit', size: 14 },
                        bodyFont: { family: 'DM Sans', size: 13 },
                        padding: 12,
                        cornerRadius: 8,
                        displayColors: false
                    }
                },
                cutout: '70%'
            }
        });

        // Floor Bar Chart
        new Chart(document.getElementById('floorChart'), {
            type: 'bar',
            data: {
                labels: floorData.labels,
                datasets: [{
                    label: '매물 수',
                    data: floorData.counts,
                    backgroundColor: 'rgba(16, 185, 129, 0.4)',
                    borderColor: '#10B981',
                    borderWidth: 2,
                    borderRadius: 6,
                    hoverBackgroundColor: '#10B981'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1A1D24',
                        padding: 12,
                        cornerRadius: 8
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#9CA3AF', font: { family: 'Outfit' } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#9CA3AF', font: { family: 'Outfit' } }
                    }
                }
            }
        });

        // Populate Keywords
        const keywordContainer = document.getElementById('keywordList');
        keywords.forEach(k => {
            const div = document.createElement('div');
            div.className = 'keyword-item';
            div.innerHTML = `
                <span class="keyword-name">${k.word}</span>
                <span class="keyword-score">${k.weight}</span>
            `;
            keywordContainer.appendChild(div);
        });

        // Populate Table
        const tableBody = document.getElementById('dataTableBody');
        topStores.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight:500">${s.title}</td>
                <td>${s.dep}</td>
                <td>${s.rent}</td>
                <td>${s.prem}</td>
                <td>${s.size} ㎡</td>
                <td><span class="tag">${s.views}</span></td>
            `;
            tableBody.appendChild(tr);
        });
    </script>
</body>
</html>
