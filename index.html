<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nemo 부동산 분석 대시보드</title>
    <script src="data.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0F1115',
                        card: '#1A1D24',
                        accent: '#10B981',
                        border: '#2D333F',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0F1115; color: #F3F4F6; }
        .glass-card { background: rgba(26, 29, 36, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .num-align { font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
        .animate { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-[1440px] mx-auto">
        <header class="flex justify-between items-center mb-10 pb-4 border-b border-border">
            <div>
                <h1 class="text-4xl font-black bg-gradient-to-r from-white to-accent bg-clip-text text-transparent">nemo 분석</h1>
                <p class="text-gray-400 text-sm mt-1">강남 상권 매물 673건 실시간 데이터 분석</p>
            </div>
            <div class="hidden md:flex gap-2">
                <span class="px-3 py-1 bg-accent/10 text-accent rounded-full text-[10px] font-bold uppercase tracking-widest">Live Analysis</span>
                <span class="px-3 py-1 bg-white/5 text-gray-400 rounded-full text-[10px] font-bold uppercase tracking-widest" id="lastUpdated"></span>
            </div>
        </header>

        <!-- 핵심 요약 카드 (5개) -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-8">
            <div class="stat-card glass-card p-5 rounded-2xl animate" style="animation-delay: 0.1s">
                <div class="text-[10px] text-gray-500 font-bold uppercase mb-1">총 매물 수</div>
                <div class="text-2xl font-black" id="totalStores">0</div>
                <div class="mt-1 text-[10px] text-accent">공급 현황 정상</div>
            </div>
            <div class="stat-card glass-card p-5 rounded-2xl animate" style="animation-delay: 0.2s">
                <div class="text-[10px] text-gray-500 font-bold uppercase mb-1">평균 평당 월세</div>
                <div class="text-2xl font-black" id="avgRentPy">0<span class="text-xs font-normal text-gray-600 ml-1">만</span></div>
                <div class="mt-1 text-[10px] text-gray-500">강남구 평균 지표</div>
            </div>
            <div class="stat-card glass-card p-5 rounded-2xl animate" style="animation-delay: 0.3s">
                <div class="text-[10px] text-gray-500 font-bold uppercase mb-1">가성비 꿀매물</div>
                <div class="text-2xl font-black" id="bestValue">0<span class="text-xs font-normal text-gray-600 ml-1">건</span></div>
                <div class="mt-1 text-[10px] text-yellow-500">평균가 70% 이하</div>
            </div>
            <div class="stat-card glass-card p-5 rounded-2xl animate" style="animation-delay: 0.4s">
                <div class="text-[10px] text-gray-500 font-bold uppercase mb-1">인기 급상승</div>
                <div class="text-2xl font-black" id="trending">0<span class="text-xs font-normal text-gray-600 ml-1">건</span></div>
                <div class="mt-1 text-[10px] text-blue-400">조회수 상위 5%</div>
            </div>
            <div class="stat-card glass-card p-5 rounded-2xl animate" style="animation-delay: 0.5s">
                <div class="text-[10px] text-gray-500 font-bold uppercase mb-1">역세권 비율</div>
                <div class="text-2xl font-black" id="subwayRate">0<span class="text-xs font-normal text-gray-600 ml-1">%</span></div>
                <div class="mt-1 text-[10px] text-purple-400">역 300m 이내 추정</div>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-6 mb-8">
            <!-- 시각화 영역 -->
            <div class="col-span-12 lg:col-span-8 glass-card p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-6 flex items-center gap-2"><i data-lucide="scatter-chart" class="w-5 h-5 text-accent"></i> 임대료 vs 면적 상관관계</h2>
                <div class="h-[400px]"><canvas id="scatterChart"></canvas></div>
            </div>
            <div class="col-span-12 lg:col-span-4 glass-card p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-6 flex items-center gap-2"><i data-lucide="pie-chart" class="w-5 h-5 text-accent"></i> 업종별 분포</h2>
                <div class="h-[400px]"><canvas id="industryChart"></canvas></div>
            </div>
            
            <div class="col-span-12 lg:col-span-4 glass-card p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-6 flex items-center gap-2"><i data-lucide="bar-chart" class="w-5 h-5 text-accent"></i> 보증금 구간 분포</h2>
                <div class="h-[250px]"><canvas id="depHist"></canvas></div>
            </div>
            <div class="col-span-12 lg:col-span-4 glass-card p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-6 flex items-center gap-2"><i data-lucide="bar-chart-2" class="w-5 h-5 text-accent"></i> 월세 구간 분포</h2>
                <div class="h-[250px]"><canvas id="rentHist"></canvas></div>
            </div>
            <div class="col-span-12 lg:col-span-4 glass-card p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-6 flex items-center gap-2"><i data-lucide="layers" class="w-5 h-5 text-accent"></i> 층별 분포</h2>
                <div class="h-[250px]"><canvas id="floorChart"></canvas></div>
            </div>
        </div>

        <!-- 테이블 영역 -->
        <div class="glass-card p-8 rounded-3xl mb-10">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <h2 class="text-2xl font-black">데이터 익스플로러</h2>
                <div class="flex gap-4 w-full md:w-auto">
                    <input type="text" id="search" placeholder="매물 검색..." class="bg-dark border border-border rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-accent flex-1 md:w-64">
                    <select id="pageSize" class="bg-dark border border-border rounded-xl px-4 py-2 text-sm">
                        <option value="10">10개</option>
                        <option value="20">20개</option>
                        <option value="50">50개</option>
                    </select>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-gray-500 text-[10px] uppercase font-bold border-b border-border">
                            <th class="p-4">#</th>
                            <th class="p-4">매물 명칭</th>
                            <th class="p-4 text-right">보증금</th>
                            <th class="p-4 text-right">월세</th>
                            <th class="p-4 text-right">평당월세</th>
                            <th class="p-4 text-right">면적(㎡)</th>
                            <th class="p-4 text-right">조회수</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="flex justify-between items-center mt-8">
                <div id="tableInfo" class="text-xs text-gray-500"></div>
                <div id="pagination" class="flex gap-2"></div>
            </div>
        </div>
    </div>

    <script>
        const processedData = allStores.map(s => ({
            ...s,
            rentPy: Math.round(s.rent / (s.size / 3.305)),
            isSubway: /역|역세권|출구|도보/.test(s.title)
        }));

        let filtered = [...processedData];
        let page = 1;
        let size = 10;

        function updateUI() {
            // Stats
            const total = processedData.length;
            const avg = Math.round(processedData.reduce((a,b)=>a+b.rentPy, 0)/total);
            const best = processedData.filter(s=>s.rentPy < avg * 0.7).length;
            const topViews = [...processedData].sort((a,b)=>b.views-a.views)[Math.floor(total*0.05)].views;
            const trend = processedData.filter(s=>s.views >= topViews).length;
            const sub = ((processedData.filter(s=>s.isSubway).length / total)*100).toFixed(1);

            document.getElementById('totalStores').innerText = total.toLocaleString();
            document.getElementById('avgRentPy').innerText = avg.toLocaleString();
            document.getElementById('bestValue').innerText = best.toLocaleString();
            document.getElementById('trending').innerText = trend.toLocaleString();
            document.getElementById('subwayRate').innerText = sub;

            // Table
            const start = (page-1)*size;
            const end = start + size;
            const pData = filtered.slice(start, end);
            const body = document.getElementById('tableBody');
            body.innerHTML = pData.map((s,i)=>`
                <tr class="border-b border-border/50 hover:bg-white/[0.02] transition-colors group">
                    <td class="p-4 text-gray-600 text-xs num-align">${start+i+1}</td>
                    <td class="p-4 font-bold text-white/90">${s.title}</td>
                    <td class="p-4 text-right num-align">${s.dep.toLocaleString()}</td>
                    <td class="p-4 text-right num-align">${s.rent.toLocaleString()}</td>
                    <td class="p-4 text-right"><span class="px-2 py-0.5 rounded text-xs num-align ${s.rentPy < avg*0.7 ? 'bg-accent/10 text-accent' : 'text-gray-500'}">${s.rentPy.toLocaleString()}</span></td>
                    <td class="p-4 text-right num-align text-gray-500">${s.size.toFixed(1)}</td>
                    <td class="p-4 text-right num-align text-white/20 group-hover:text-white/50">${s.views.toLocaleString()}</td>
                </tr>
            `).join('');

            document.getElementById('tableInfo').innerText = `Displaying ${start+1}-${Math.min(end, filtered.length)} of ${filtered.length}`;
            
            // Pagination
            const totalPages = Math.ceil(filtered.length / size);
            const pagin = document.getElementById('pagination');
            pagin.innerHTML = '';
            for(let i=Math.max(1, page-2); i<=Math.min(totalPages, page+2); i++) {
                const b = document.createElement('button');
                b.innerText = i;
                b.className = `w-8 h-8 rounded-lg text-xs ${i===page ? 'bg-accent text-white font-bold' : 'text-gray-500 hover:bg-white/10'}`;
                b.onclick = () => { page=i; updateUI(); };
                pagin.appendChild(b);
            }
        }

        function initCharts() {
            Chart.defaults.color = '#666';
            Chart.defaults.font.family = 'Pretendard';

            // Scatter
            new Chart(document.getElementById('scatterChart'), {
                type: 'scatter',
                data: { datasets: [{ label: '매물', data: processedData.map(s=>({x:s.size, y:s.rent})), backgroundColor: 'rgba(16, 185, 129, 0.4)', pointRadius: 2 }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: '#222' } }, y: { grid: { color: '#222' } } } }
            });

            // Industry
            const indMap = {};
            processedData.forEach(s=> { const c = s.category || '기타'; indMap[c] = (indMap[c] || 0) + 1; });
            const labels = Object.keys(indMap).sort((a,b)=>indMap[b]-indMap[a]).slice(0, 5);
            new Chart(document.getElementById('industryChart'), {
                type: 'doughnut',
                data: { labels, datasets: [{ data: labels.map(l=>indMap[l]), backgroundColor: ['#10B981', '#059669', '#047857', '#065F46', '#064E3B'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%' }
            });

            // Dep Hist
            const depData = [0,0,0,0,0];
            processedData.forEach(s=> {
                if(s.dep < 5000) depData[0]++;
                else if(s.dep < 10000) depData[1]++;
                else if(s.dep < 30000) depData[2]++;
                else if(s.dep < 100000) depData[3]++;
                else depData[4]++;
            });
            new Chart(document.getElementById('depHist'), {
                type: 'bar',
                data: { labels: ['~5k', '5k-10k', '10k-30k', '30k-100k', '100k+'], datasets: [{ data: depData, backgroundColor: 'rgba(59, 130, 246, 0.4)', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            // Rent Hist
            const rentData = [0,0,0,0,0];
            processedData.forEach(s=> {
                if(s.rent < 100) rentData[0]++;
                else if(s.rent < 250) rentData[1]++;
                else if(s.rent < 500) rentData[2]++;
                else if(s.rent < 1000) rentData[3]++;
                else rentData[4]++;
            });
            new Chart(document.getElementById('rentHist'), {
                type: 'bar',
                data: { labels: ['~100', '100-250', '250-500', '500-1k', '1k+'], datasets: [{ data: rentData, backgroundColor: 'rgba(16, 185, 129, 0.4)', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            // Floor
            const fData = [
                processedData.filter(s=>/지하/.test(s.floor)).length,
                processedData.filter(s=>s.floor==='1').length,
                processedData.filter(s=>s.floor==='2').length,
                processedData.filter(s=>s.floor==='3').length,
                processedData.filter(s=>parseInt(s.floor)>=4).length
            ];
            new Chart(document.getElementById('floorChart'), {
                type: 'bar',
                data: { labels: ['지하', '1F', '2F', '3F', '4F+'], datasets: [{ data: fData, backgroundColor: 'rgba(251, 191, 36, 0.4)', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        document.getElementById('search').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            filtered = processedData.filter(s=>s.title.toLowerCase().includes(t));
            page = 1; updateUI();
        };

        document.getElementById('pageSize').onchange = (e) => {
            size = parseInt(e.target.value);
            page = 1; updateUI();
        };

        document.getElementById('lastUpdated').innerText = new Date().toLocaleTimeString();
        lucide.createIcons();
        updateUI();
        initCharts();
    </script>
</body>
</html>
