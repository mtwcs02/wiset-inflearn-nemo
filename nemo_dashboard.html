<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nemo 부동산 분석 대시보드 V2.5 Professional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="data.js?v=2.5"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0F1115; color: #E5E7EB; }
        .glass-card { background: rgba(23, 25, 30, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .num-align { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
        .text-accent { color: #10B981; }
        .bg-accent { background-color: #10B981; }
        .bg-dark { background-color: #0A0C0E; }
        .top-rank-card { background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%); border: 1px solid rgba(255,255,255,0.03); transition: all 0.3s ease; }
        .top-rank-card:hover { border-color: rgba(16, 185, 129, 0.3); transform: translateY(-2px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate { animation: fadeIn 0.6s ease-out forwards; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-[1440px] mx-auto">
        <header class="flex justify-between items-center mb-10 pb-4 border-b border-white/5">
            <div>
                <h1 class="text-4xl font-black bg-gradient-to-r from-white to-accent bg-clip-text text-transparent inline-flex items-center">
                    nemo 분석
                    <span class="text-[10px] font-normal text-gray-600 ml-3 tracking-widest opacity-50">V2.6 Professional</span>
                </h1>
                <p class="text-gray-400 text-sm mt-1">강남 상권 매물 673건 정밀 데이터 솔루션</p>
            </div>
            <div class="hidden md:flex gap-3">
                <a href="stores_eda_slides.html" target="_blank" class="px-3 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-blue-500/20 transition-all flex items-center gap-1">
                    <i data-lucide="presentation" class="w-3 h-3"></i> View EDA Slides
                </a>
                <span class="px-3 py-1 bg-accent/10 text-accent rounded-full text-[10px] font-bold uppercase tracking-widest">Premium</span>
            </div>
        </header>

        <!-- Professional 요약 섹션 -->
        <div class="grid grid-cols-12 gap-6 mb-8">
            <div class="col-span-12 lg:col-span-6 glass-card p-6 rounded-3xl">
                <h3 class="text-sm font-bold text-accent mb-4 flex items-center gap-2"><i data-lucide="trending-up" class="w-4 h-4"></i> HOT TOP 5 (관심도 순위)</h3>
                <div id="hottestList" class="space-y-3"></div>
            </div>
            <div class="col-span-12 lg:col-span-6 glass-card p-6 rounded-3xl">
                <h3 class="text-sm font-bold text-blue-400 mb-4 flex items-center gap-2"><i data-lucide="award" class="w-4 h-4"></i> BEST VALUE TOP 5 (가성비 순위)</h3>
                <div id="bestValueList" class="space-y-3"></div>
            </div>
        </div>

        <!-- 핵심 요약 카드 -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8" id="statsContainer"></div>

        <!-- 차트 영역 -->
        <div class="grid grid-cols-12 gap-6 mb-8">
            <div class="col-span-12 lg:col-span-8 glass-card p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-6 flex items-center gap-2"><i data-lucide="scatter-chart" class="w-5 h-5 text-accent"></i> 임대료 vs 면적 상관관계 (추세선 포함)</h2>
                <div class="h-[400px]"><canvas id="scatterChart"></canvas></div>
            </div>
            <div class="col-span-12 lg:col-span-4 glass-card p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-6 flex items-center gap-2"><i data-lucide="map-pin" class="w-5 h-5 text-accent"></i> 법정동별 평균 임대료</h2>
                <div class="h-[400px]"><canvas id="dongChart"></canvas></div>
            </div>
            <div class="col-span-12 md:col-span-3 glass-card p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i data-lucide="pie-chart" class="w-4 h-4 text-accent"></i> 업종별 분포</h2>
                <div class="h-[200px]"><canvas id="industryChart"></canvas></div>
            </div>
            <div class="col-span-12 md:col-span-3 glass-card p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i data-lucide="bar-chart" class="w-4 h-4 text-accent"></i> 보증금 구간</h2>
                <div class="h-[200px]"><canvas id="depHist"></canvas></div>
            </div>
            <div class="col-span-12 md:col-span-3 glass-card p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i data-lucide="bar-chart-2" class="w-4 h-4 text-accent"></i> 월세 구간</h2>
                <div class="h-[200px]"><canvas id="rentHist"></canvas></div>
            </div>
            <div class="col-span-12 md:col-span-3 glass-card p-6 rounded-3xl">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i data-lucide="layers" class="w-4 h-4 text-accent"></i> 층별 분포</h2>
                <div class="h-[200px]"><canvas id="floorChart"></canvas></div>
            </div>
        </div>

        <!-- 데이터 테이블 -->
        <div class="glass-card p-8 rounded-3xl mb-10">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <h2 class="text-2xl font-black">데이터 익스플로러</h2>
                <div class="flex flex-wrap gap-4 w-full md:w-auto">
                    <input type="text" id="search" placeholder="매물 검색..." class="bg-dark border border-white/10 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-accent flex-1 md:w-64">
                    <select id="sortSelect" onchange="handleSort(this.value)" class="bg-dark border border-white/10 rounded-xl px-4 py-2 text-sm text-gray-300 focus:outline-none focus:border-accent">
                        <option value="id-asc">등록순 (기본)</option>
                        <option value="dep-desc">보증금 높은순</option>
                        <option value="dep-asc">보증금 낮은순</option>
                        <option value="rent-desc">월세 높은순</option>
                        <option value="rent-asc">월세 낮은순</option>
                        <option value="rentPy-asc">가성비순 (평당가 낮음)</option>
                        <option value="views-desc">인기순 (조회수 많음)</option>
                    </select>
                    <select id="pageSize" onchange="size=Number(this.value); page=1; updateUI();" class="bg-dark border border-white/10 rounded-xl px-4 py-2 text-sm text-gray-300">
                        <option value="15">15개씩</option>
                        <option value="30">30개씩</option>
                        <option value="50">50개씩</option>
                    </select>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left" style="table-layout: fixed; min-width: 1000px;">
                    <thead>
                        <tr class="text-gray-500 text-[10px] uppercase font-bold border-b border-white/5">
                            <th class="p-4 w-16 text-center">#</th>
                            <th class="p-4">매물 정보</th>
                            <th class="p-4 w-32 text-right">보증금</th>
                            <th class="p-4 w-32 text-right">월세</th>
                            <th class="p-4 w-32 text-right">평당월세</th>
                            <th class="p-4 w-32 text-right">면적</th>
                            <th class="p-4 w-28 text-right">조회수</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="flex justify-between items-center mt-8">
                <div id="tableInfo" class="text-xs text-gray-500 font-medium"></div>
                <div id="pagination" class="flex gap-1"></div>
            </div>
        </div>
    </div>

    <script>
        const processedData = allStores.map(s => {
            const sizeInPy = s.size / 3.305;
            const rentPy = Math.round(s.rent / (sizeInPy || 1));
            
            let floor = '1층'; 
            const fMatch = s.title.match(/(지하\s*\d*|B\d+|\d+\s*층)/i);
            if (fMatch) {
                const f = fMatch[0].toLowerCase();
                if (f.includes('지하') || f.startsWith('b')) floor = '지하';
                else if (f.includes('2층')) floor = '2층';
                else if (f.includes('3층')) floor = '3층';
                else if (/[4-9]층|1\d층/.test(f)) floor = '4층+';
                else floor = '1층';
            }

            let category = '기타/미분류';
            const t = s.title;
            if (/사무실|오피스|업무|워크|세무|법무|아이티|IT|연구소/.test(t)) category = '사무실';
            else if (/카페|디저트|커피|베이커리|커피숍|차|Tea/.test(t)) category = '카페';
            else if (/식당|음식점|포차|주점|이자카야|치킨|분식|한식|중식|일식|고기|레스토랑|주방|피자|만두|호프|술집|구이|요리|펍|Pub/.test(t)) category = '음식점';
            else if (/미용실|뷰티|헤어|왁싱|네일|에스테틱|피부|샵|바버|마사지|스파/.test(t)) category = '뷰티/미용';
            else if (/스튜디오|작업실|연습실|촬영|갤러리|렌탈|사진|유튜브/.test(t)) category = '스튜디오';
            else if (/노래방|당구장|헬스|필라테스|요가|골프|파티룸|방탈출|스터디|학원|클럽|바|Bar|테니스|볼링/.test(t)) category = '엔터/운동';
            else if (/상가|점포|매장|편의점|마트|슈퍼|판매|공실|쇼룸|약국|플래그십/.test(t)) category = '일반상가';

            let dong = '기타';
            if (s.title.includes('역삼')) dong = '역삼동';
            else if (s.title.includes('논현')) dong = '논현동';
            else if (s.title.includes('서초')) dong = '서초동';
            else if (s.title.includes('반포')) dong = '반포동';
            else if (s.title.includes('신사')) dong = '신사동';
            else if (s.title.includes('압구정')) dong = '압구정동';
            else if (s.title.includes('삼성')) dong = '삼성동';
            else if (s.title.includes('대치')) dong = '대치동';
            else if (s.title.includes('강남역')) dong = '역삼동';
            else if (s.title.includes('신논현')) dong = '반포/논현';

            return { ...s, rentPy, floor, category, dong, isSubway: /역|역세권|출구|도보/.test(s.title) };
        });
        let filtered = [...processedData];
        let page = 1;
        let size = 15;
        let sortConfig = { key: 'id', direction: 'asc' };

        function handleSort(val) {
            const [key, dir] = val.split('-');
            sortConfig.key = key;
            sortConfig.direction = dir;
            updateUI();
        }

        function updateUI() {
            // Sort
            filtered.sort((a, b) => {
                const v1 = a[sortConfig.key];
                const v2 = b[sortConfig.key];
                if (sortConfig.direction === 'asc') return v1 > v2 ? 1 : -1;
                return v1 < v2 ? 1 : -1;
            });

            const total = processedData.length;
            if (total === 0) return;

            const avg = Math.round(processedData.reduce((a,b)=>a+b.rentPy, 0)/total);
            const best = processedData.filter(s=>s.rentPy < avg * 0.7).length;
            const sortedByViews = [...processedData].sort((a,b)=>b.views-a.views);
            const topViews = sortedByViews.length > 0 ? sortedByViews[Math.floor(total*0.05)].views : 0;
            const trend = processedData.filter(s=>s.views >= topViews).length;
            const sub = ((processedData.filter(s=>s.isSubway).length / total)*100).toFixed(1);

            // Professional TOP 5
            const hotTop5 = [...processedData].sort((a,b)=>b.views-a.views).slice(0, 5);
            const valueTop5 = [...processedData].sort((a,b)=>a.rentPy-b.rentPy).slice(0, 5);

            document.getElementById('hottestList').innerHTML = hotTop5.map((s, idx)=>`
                <div class="top-rank-card flex items-center justify-between p-3 rounded-xl">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="text-accent font-black text-lg italic">#${idx+1}</span>
                        <div class="overflow-hidden">
                            <div class="text-xs font-bold text-white/90 truncate">${s.title}</div>
                            <div class="text-[10px] text-gray-500">${s.dong} • ${s.category}</div>
                        </div>
                    </div>
                    <div class="text-right ml-2 shrink-0">
                        <div class="text-xs font-bold text-white">${s.views.toLocaleString()}회</div>
                        <div class="text-[10px] text-gray-600">조회수</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('bestValueList').innerHTML = valueTop5.map((s, idx)=>`
                <div class="top-rank-card flex items-center justify-between p-3 rounded-xl">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="text-blue-400 font-black text-lg italic">#${idx+1}</span>
                        <div class="overflow-hidden">
                            <div class="text-xs font-bold text-white/90 truncate">${s.title}</div>
                            <div class="text-[10px] text-gray-500">${s.dong} • ${s.category}</div>
                        </div>
                    </div>
                    <div class="text-right ml-2 shrink-0">
                        <div class="text-xs font-bold text-white">${s.rentPy.toLocaleString()}만</div>
                        <div class="text-[10px] text-gray-600">평당가</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('statsContainer').innerHTML = `
                <div class="stat-card glass-card p-5 rounded-2xl animate">
                    <div class="text-[10px] text-gray-500 font-bold uppercase mb-1">총 매물</div>
                    <div class="text-2xl font-black">${total.toLocaleString()}</div>
                </div>
                <div class="stat-card glass-card p-5 rounded-2xl animate" style="animation-delay: 0.1s">
                    <div class="text-[10px] text-gray-500 font-bold uppercase mb-1">평균 평당가</div>
                    <div class="text-2xl font-black">${avg.toLocaleString()}<span class="text-xs font-normal opacity-40 ml-1">만</span></div>
                </div>
                <div class="stat-card glass-card p-5 rounded-2xl animate" style="animation-delay: 0.2s">
                    <div class="text-[10px] text-gray-500 font-bold uppercase mb-1">역세권 비율</div>
                    <div class="text-2xl font-black text-purple-400">${sub}%</div>
                </div>
                <div class="stat-card glass-card p-5 rounded-2xl animate" style="animation-delay: 0.3s">
                    <div class="text-[10px] text-gray-500 font-bold uppercase mb-1">최고 조회수</div>
                    <div class="text-2xl font-black text-accent">${hotTop5[0].views.toLocaleString()}</div>
                </div>
                <div class="stat-card glass-card p-5 rounded-2xl animate" style="animation-delay: 0.4s">
                    <div class="text-[10px] text-gray-500 font-bold uppercase mb-1">최저 평당가</div>
                    <div class="text-2xl font-black text-blue-400">${valueTop5[0].rentPy.toLocaleString()}</div>
                </div>
            `;

            const start = (page-1)*size;
            const pData = filtered.slice(start, start + size);
            const body = document.getElementById('tableBody');
            body.innerHTML = pData.map((s,i)=>`
                <tr class="border-b border-white/5 hover:bg-white/[0.02] transition-colors group">
                    <td class="p-4 text-gray-600 text-xs num-align">${start+i+1}</td>
                    <td class="p-4">
                        <div class="flex flex-col">
                            <span class="font-bold text-white/90 truncate max-w-[400px] block" title="${s.title}">${s.title}</span>
                            <span class="text-[10px] text-accent/60 font-semibold mt-1">${s.category} • ${s.floor}</span>
                        </div>
                    </td>
                    <td class="p-4 text-right font-bold text-white/90 num-align text-lg">${s.dep.toLocaleString()}</td>
                    <td class="p-4 text-right font-bold text-white/90 num-align text-lg">${s.rent.toLocaleString()}</td>
                    <td class="p-4 text-right font-bold text-white/90 num-align text-lg">${s.rentPy.toLocaleString()}</td>
                    <td class="p-4 text-right font-bold text-white/90 num-align text-lg">${s.size.toFixed(1)}</td>
                    <td class="p-4 text-right font-bold text-white/90 num-align text-lg">${s.views.toLocaleString()}</td>
                </tr>
            `).join('');

            document.getElementById('tableInfo').innerText = `SHOWING ${start+1}-${Math.min(start+size, filtered.length)} OF ${filtered.length}`;
            
            const totalPages = Math.ceil(filtered.length / size);
            const pagin = document.getElementById('pagination');
            pagin.innerHTML = '';
            for(let i=Math.max(1, page-2); i<=Math.min(totalPages, page+2); i++) {
                const b = document.createElement('button');
                b.innerText = i;
                b.className = `w-8 h-8 rounded-lg text-xs transition-all ${i===page ? 'bg-accent text-white font-bold' : 'text-gray-500 hover:bg-white/10'}`;
                b.onclick = () => { page=i; updateUI(); window.scrollTo({top: document.getElementById('tableBody').offsetTop - 200, behavior: 'smooth'}); };
                pagin.appendChild(b);
            }
        }

        function initCharts() {
            lucide.createIcons();
            Chart.defaults.color = '#555';
            Chart.defaults.font.family = 'Pretendard';

            // Scatter with Regression Line
            const scatterData = processedData.map(s=>({x:s.size, y:s.rent}));
            const n = scatterData.length;
            const sumX = scatterData.reduce((a,b)=>a+b.x, 0);
            const sumY = scatterData.reduce((a,b)=>a+b.y, 0);
            const sumXY = scatterData.reduce((a,b)=>a+b.x*b.y, 0);
            const sumXX = scatterData.reduce((a,b)=>a+b.x*b.x, 0);
            const slope = (n*sumXY - sumX*sumY) / (n*sumXX - sumX*sumX);
            const intercept = (sumY - slope*sumX) / n;
            const maxArea = Math.max(...scatterData.map(d=>d.x));

            new Chart(document.getElementById('scatterChart'), {
                type: 'scatter',
                data: { 
                    datasets: [
                        { label: '매물', data: scatterData, backgroundColor: 'rgba(16, 185, 129, 0.4)', pointRadius: 2.5 },
                        { 
                            label: '평균 추세선', 
                            data: [{x:0, y:intercept}, {x:maxArea, y:slope*maxArea + intercept}], 
                            type: 'line', 
                            borderColor: 'rgba(255,255,255,0.2)', 
                            borderDash: [5, 5], 
                            pointRadius: 0,
                            borderWidth: 1
                        }
                    ] 
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: '#1A1D23' }, title: { display: true, text: '면적 (㎡)' } }, y: { grid: { color: '#1A1D23' }, title: { display: true, text: '월세 (만)' } } }, plugins: { legend: { display: false } } }
            });

            // Dong Comparison Chart
            const dongMap = {};
            processedData.forEach(s=> {
                if(!dongMap[s.dong]) dongMap[s.dong] = { sum:0, count:0 };
                dongMap[s.dong].sum += s.rentPy;
                dongMap[s.dong].count++;
            });
            const dLabels = Object.keys(dongMap).sort((a,b)=>dongMap[b].sum/dongMap[b].count - dongMap[a].sum/dongMap[a].count);
            new Chart(document.getElementById('dongChart'), {
                type: 'bar',
                data: {
                    labels: dLabels,
                    datasets: [{
                        label: '평균 평당가',
                        data: dLabels.map(l=> Math.round(dongMap[l].sum/dongMap[l].count)),
                        backgroundColor: dLabels.map((l,i)=> i===0 ? '#10B981' : 'rgba(255,255,255,0.1)'),
                        borderRadius: 8
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    indexAxis: 'y',
                    plugins: { legend: { display: false } },
                    scales: { x: { grid: { display: false }, ticks: { display: false } }, y: { grid: { display: false } } }
                }
            });

            const indMap = {};
            processedData.forEach(s=> { indMap[s.category] = (indMap[s.category] || 0) + 1; });
            const labels = Object.keys(indMap).sort((a,b)=>indMap[b]-indMap[a]);
            new Chart(document.getElementById('industryChart'), {
                type: 'doughnut',
                data: { labels, datasets: [{ data: labels.map(l=>indMap[l]), backgroundColor: ['#10B981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#6b7280', '#1f2937'], borderWidth: 0, hoverOffset: 15 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, padding: 15, font: { size: 10 }, color: '#999' } } } }
            });

            const fLabels = ['지하', '1층', '2층', '3층', '4층+'];
            const fData = fLabels.map(l => processedData.filter(s => s.floor === l).length);
            new Chart(document.getElementById('floorChart'), {
                type: 'bar',
                data: { labels: fLabels, datasets: [{ data: fData, backgroundColor: 'rgba(251, 191, 36, 0.4)', borderRadius: 6, hoverBackgroundColor: '#FBBF24' }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: '#1A1D23' } }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } }
            });

            // 히스토그램들 동일 로직...
            const depData = [0,0,0,0,0];
            processedData.forEach(s=> {
                if(s.dep < 5000) depData[0]++;
                else if(s.dep < 10000) depData[1]++;
                else if(s.dep < 30000) depData[2]++;
                else if(s.dep < 100000) depData[3]++;
                else depData[4]++;
            });
            new Chart(document.getElementById('depHist'), {
                type: 'bar',
                data: { labels: ['~5천', '1억', '3억', '10억', '10억+'], datasets: [{ data: depData, backgroundColor: 'rgba(59, 130, 246, 0.3)', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#1A1D23' } }, x: { grid: { display: false } } } }
            });

            const rentData = [0,0,0,0,0];
            processedData.forEach(s=> {
                if(s.rent < 100) rentData[0]++;
                else if(s.rent < 250) rentData[1]++;
                else if(s.rent < 500) rentData[2]++;
                else if(s.rent < 1000) rentData[3]++;
                else rentData[4]++;
            });
            new Chart(document.getElementById('rentHist'), {
                type: 'bar',
                data: { labels: ['~100', '250', '500', '1천', '1천+'], datasets: [{ data: rentData, backgroundColor: 'rgba(16, 185, 129, 0.3)', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#1A1D23' } }, x: { grid: { display: false } } } }
            });
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const v = e.target.value.toLowerCase();
            filtered = processedData.filter(s => s.title.toLowerCase().includes(v) || s.category.toLowerCase().includes(v));
            page = 1;
            updateUI();
        });

        window.onload = () => { 
            try {
                updateUI(); 
                initCharts(); 
            } catch (e) {
                console.error("Initialization failed:", e);
            }
        };
    </script>
</body>
</html>
